name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python3 -c 'import json; print(json.load(open("custom_components/floorplan_3d/manifest.json"))["version"])')
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi

      - name: Release notes from the changelog
        run: |
          awk -v v="## ${GITHUB_REF_NAME#v}" '
            $0 == v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md

      - name: Package
        run: |
          cd custom_components/floorplan_3d
          zip -r ../../floorplan_3d.zip . -x '__pycache__/*'

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" floorplan_3d.zip --title "$GITHUB_REF_NAME" --notes-file notes.md
